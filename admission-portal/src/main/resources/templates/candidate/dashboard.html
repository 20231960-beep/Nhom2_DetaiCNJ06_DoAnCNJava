<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hồ sơ của tôi</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{layout/fragments :: header}"></div>

<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold" style="color:#1e3a8a;">
            Xin chào, <span th:text="${fullName}">Thí sinh</span>!
        </h2>
        <div>
            <a href="/candidate/profile" class="btn btn-outline-primary me-2">Thông tin cá nhân</a>
            <a href="/candidate/applications/new" class="btn text-white" style="background-color:#1e3a8a;">
                + Nộp hồ sơ mới
            </a>
        </div>
    </div>

    <table class="table table-bordered bg-white">
        <thead class="table-light">
        <tr><th>Đợt tuyển sinh</th><th>Ngành đăng ký</th><th>Trạng thái</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="app : ${applications}">
            <td th:text="${app.admissionSession?.name ?: 'N/A'}"></td>
            <td th:text="${app.major?.name ?: 'N/A'}"></td>
            <td>
                <span class="badge bg-info text-dark" th:text="${app.status?.label}"></span>
            </td>
            <td>
                <a th:href="@{/candidate/applications/{id}(id=${app.id})}" class="btn btn-sm btn-outline-primary">Xem chi tiết</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(applications)}">
            <td colspan="4" class="text-center text-muted">Bạn chưa có hồ sơ đăng ký nào.</td>
        </tr>
        </tbody>
    </table>
</main>

<div th:replace="~{layout/fragments :: footer}"></div>
</body>
</html>
