<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thông tin cá nhân</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{layout/fragments :: header}"></div>

<main class="container py-5" style="max-width:680px;">
    <h2 class="fw-bold mb-4" style="color:#1e3a8a;">Thông tin cá nhân</h2>

    <div th:if="${param.updated}" class="alert alert-success">Cập nhật thông tin thành công.</div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="bg-white border rounded p-4 mb-4">
        <p class="mb-1"><strong>Họ và tên:</strong> <span th:text="${fullName}"></span></p>
        <p class="mb-0"><strong>Email:</strong> <span th:text="${email}"></span></p>
        <p class="text-muted small mt-2 mb-0">Để đổi họ tên/email, vui lòng liên hệ quản trị viên.</p>
    </div>

    <form th:action="@{/candidate/profile/save}" th:object="${profileRequest}" method="post">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Ngày sinh</label>
                <input type="date" th:field="*{dob}" class="form-control">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Giới tính</label>
                <select th:field="*{gender}" class="form-select">
                    <option value="">-- Chọn giới tính --</option>
                    <option th:each="g : ${genders}" th:value="${g}" th:text="${g.label}"></option>
                </select>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Số CCCD / CMND</label>
            <input type="text" th:field="*{idCardNumber}" class="form-control" maxlength="20">
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Số điện thoại</label>
                <input type="text" th:field="*{phone}" class="form-control" maxlength="15">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Tỉnh / Thành phố</label>
                <input type="text" th:field="*{province}" class="form-control">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Địa chỉ chi tiết</label>
            <input type="text" th:field="*{address}" class="form-control">
        </div>

        <div class="row">
            <div class="col-md-8 mb-3">
                <label class="form-label">Trường THPT</label>
                <input type="text" th:field="*{highSchool}" class="form-control">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Năm tốt nghiệp</label>
                <input type="number" th:field="*{graduationYear}" class="form-control" min="1990" max="2100">
            </div>
        </div>

        <button type="submit" class="btn text-white" style="background-color:#1e3a8a;">Lưu thông tin</button>
        <a href="/candidate/dashboard" class="btn btn-outline-secondary">Hủy</a>
    </form>
</main>

<div th:replace="~{layout/fragments :: footer}"></div>
</body>
</html>
