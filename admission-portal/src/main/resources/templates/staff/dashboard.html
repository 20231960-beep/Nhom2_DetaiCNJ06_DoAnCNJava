<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Xét duyệt hồ sơ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{layout/fragments :: header}"></div>

<main class="container py-5">
    <h2 class="fw-bold" style="color:#1e3a8a;">
        Xin chào, <span th:text="${fullName}">Nhân viên</span>!
    </h2>
    <p class="text-secondary">Danh sách hồ sơ đăng ký xét tuyển.</p>

    <!-- Dai tab loc theo trang thai. Bam vao 1 tab se gan query param ?status=XXX, giu nguyen tu khoa dang tim -->
    <ul class="nav nav-pills mb-3 flex-wrap">
        <li class="nav-item">
            <a class="nav-link" th:href="@{/staff/dashboard(keyword=${keyword})}"
               th:classappend="${selectedStatus == null} ? 'active text-white' : 'text-primary'"
               th:style="${selectedStatus == null} ? 'background-color:#1e3a8a;' : ''">
                Tất cả
            </a>
        </li>
        <li class="nav-item" th:each="s : ${allStatuses}" th:if="${s.name() != 'DRAFT'}">
            <a class="nav-link"
               th:href="@{/staff/dashboard(status=${s},keyword=${keyword})}"
               th:text="${s.label}"
               th:classappend="${selectedStatus == s} ? 'active text-white' : 'text-primary'"
               th:style="${selectedStatus == s} ? 'background-color:#1e3a8a;' : ''">
            </a>
        </li>
    </ul>

    <!-- Form tim kiem theo ten thi sinh. Dung GET de giu lai state qua URL (co the bookmark, F5 khong mat) -->
    <form method="get" th:action="@{/staff/dashboard}" class="row g-2 mb-4">
        <input type="hidden" name="status" th:if="${selectedStatus != null}" th:value="${selectedStatus}">
        <div class="col-auto flex-grow-1" style="max-width:320px;">
            <input type="text" name="keyword" class="form-control" placeholder="Tìm theo tên thí sinh..."
                   th:value="${keyword}">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn text-white" style="background-color:#1e3a8a;">Tìm kiếm</button>
        </div>
        <div class="col-auto" th:if="${keyword != null and !#strings.isEmpty(keyword)}">
            <a class="btn btn-outline-secondary"
               th:href="@{/staff/dashboard(status=${selectedStatus})}">Xóa lọc</a>
        </div>
        <div class="col-auto ms-auto">
            <a class="btn btn-success" th:href="@{/staff/applications/export-admitted}">
                📊 Xuất Excel danh sách trúng tuyển
            </a>
        </div>
    </form>

    <table class="table table-bordered bg-white">
        <thead class="table-light">
        <tr>
            <th>Thí sinh</th>
            <th>Đợt tuyển sinh</th>
            <th>Ngành</th>
            <th>Trạng thái</th>
            <th>Ngày nộp</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="app : ${pendingApplications}">
            <td th:text="${app.candidate?.user?.fullName ?: 'N/A'}"></td>
            <td th:text="${app.admissionSession?.name ?: 'N/A'}"></td>
            <td th:text="${app.major?.name ?: 'N/A'}"></td>
            <td>
                <span class="badge bg-info text-dark" th:text="${app.status?.label}"></span>
            </td>
            <td th:text="${app.submittedAt != null ? #temporals.format(app.submittedAt, 'dd/MM/yyyy HH:mm') : '—'}"></td>
            <td>
                <a th:href="@{/staff/applications/{id}(id=${app.id})}" class="btn btn-sm btn-outline-primary">Xét duyệt</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(pendingApplications)}">
            <td colspan="6" class="text-center text-muted">Không có hồ sơ nào phù hợp.</td>
        </tr>
        </tbody>
    </table>

    <!-- Phan trang -->
    <div class="d-flex flex-wrap justify-content-between align-items-center mt-3 gap-2"
         th:if="${page.totalElements > 0}"
         th:with="startPage=${page.number - 2 < 0 ? 0 : (page.number + 2 > page.totalPages - 1 ? page.totalPages - 5 : page.number - 2)},
                   startPage=${startPage < 0 ? 0 : startPage},
                   endPage=${startPage + 4 > page.totalPages - 1 ? page.totalPages - 1 : startPage + 4}">
        <small class="text-muted">
            Trang <span th:text="${page.number + 1}"></span>/<span th:text="${page.totalPages}"></span>
            &mdash; tổng <span th:text="${page.totalElements}"></span> hồ sơ
        </small>
        <ul class="pagination mb-0 flex-wrap">
            <li class="page-item" th:classappend="${!page.hasPrevious()} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/staff/dashboard(status=${selectedStatus},keyword=${keyword},page=${page.number - 1})}">Trước</a>
            </li>

            <!-- Trang dau + dau ... neu startPage khong bat dau tu 0 -->
            <li class="page-item" th:if="${startPage > 0}">
                <a class="page-link" th:href="@{/staff/dashboard(status=${selectedStatus},keyword=${keyword},page=0)}">1</a>
            </li>
            <li class="page-item disabled" th:if="${startPage > 1}"><span class="page-link">&hellip;</span></li>

            <!-- Cua so cac trang quanh trang hien tai -->
            <li class="page-item" th:each="i : ${#numbers.sequence(startPage, endPage)}"
                th:classappend="${i == page.number} ? 'active'">
                <a class="page-link" th:text="${i + 1}"
                   th:href="@{/staff/dashboard(status=${selectedStatus},keyword=${keyword},page=${i})}"></a>
            </li>

            <!-- Dau ... + trang cuoi neu endPage chua toi trang cuoi -->
            <li class="page-item disabled" th:if="${endPage < page.totalPages - 2}"><span class="page-link">&hellip;</span></li>
            <li class="page-item" th:if="${endPage < page.totalPages - 1}">
                <a class="page-link" th:text="${page.totalPages}"
                   th:href="@{/staff/dashboard(status=${selectedStatus},keyword=${keyword},page=${page.totalPages - 1})}"></a>
            </li>

            <li class="page-item" th:classappend="${!page.hasNext()} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/staff/dashboard(status=${selectedStatus},keyword=${keyword},page=${page.number + 1})}">Sau</a>
            </li>
        </ul>
    </div>
</main>

<div th:replace="~{layout/fragments :: footer}"></div>
</body>
</html>
