<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ngành học</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{layout/fragments :: header}"></div>

<main class="container py-5" style="max-width:600px;">
    <h2 class="fw-bold mb-4" style="color:#1e3a8a;"
        th:text="${major.id != null ? 'Sửa ngành học' : 'Thêm ngành học'}"></h2>

    <form th:action="@{/admin/majors/save}" th:object="${major}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
            <label class="form-label">Mã ngành</label>
            <input type="text" th:field="*{code}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Tên ngành</label>
            <input type="text" th:field="*{name}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Khoa quản lý</label>
            <input type="text" th:field="*{faculty}" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Tổ hợp môn xét tuyển</label>
            <div class="d-flex flex-wrap gap-3 border rounded p-2">
                <div class="form-check" th:each="c : ${allCombinations}">
                    <input class="form-check-input" type="checkbox" name="combinations"
                           th:id="${'comb-' + c}" th:value="${c}"
                           th:checked="${major.combinations != null and major.combinations.contains(c)}">
                    <label class="form-check-label" th:for="${'comb-' + c}" th:text="${c.label}"></label>
                </div>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Mô tả</label>
            <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
        </div>
        <button type="submit" class="btn text-white" style="background-color:#1e3a8a;">Lưu</button>
        <a href="/admin/majors" class="btn btn-outline-secondary">Hủy</a>
    </form>
</main>

<div th:replace="~{layout/fragments :: footer}"></div>
</body>
</html>
