<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý ngành học</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{layout/fragments :: header}"></div>

<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold" style="color:#1e3a8a;">Quản lý ngành học</h2>
        <a href="/admin/majors/new" class="btn text-white" style="background-color:#1e3a8a;">+ Thêm ngành</a>
    </div>

    <table class="table table-bordered bg-white">
        <thead class="table-light">
        <tr>
            <th>Mã ngành</th>
            <th>Tên ngành</th>
            <th>Khoa</th>
            <th>Tổ hợp môn</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="major : ${majors}">
            <td th:text="${major.code}"></td>
            <td th:text="${major.name}"></td>
            <td th:text="${major.faculty}"></td>
            <td>
                <span th:each="c, iter : ${major.combinations}">
                    <span th:text="${c}"></span><span th:if="${!iter.last}">, </span>
                </span>
                <span th:if="${#sets.isEmpty(major.combinations)}" class="text-muted">—</span>
            </td>
            <td>
                <a th:href="@{/admin/majors/{id}/edit(id=${major.id})}" class="btn btn-sm btn-outline-primary">Sửa</a>
                <form th:action="@{/admin/majors/{id}/delete(id=${major.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('Xóa ngành này?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Xóa</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(majors)}">
            <td colspan="5" class="text-center text-muted">Chưa có ngành học nào.</td>
        </tr>
        </tbody>
    </table>
</main>

<div th:replace="~{layout/fragments :: footer}"></div>
</body>
</html>
