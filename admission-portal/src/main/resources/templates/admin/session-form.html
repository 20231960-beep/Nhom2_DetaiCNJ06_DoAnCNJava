<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đợt tuyển sinh</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{layout/fragments :: header}"></div>

<main class="container py-5" style="max-width:700px;">
    <h2 class="fw-bold mb-4" style="color:#1e3a8a;"
        th:text="${admissionSession.id != null ? 'Sửa đợt tuyển sinh' : 'Thêm đợt tuyển sinh'}"></h2>

    <form th:action="@{/admin/sessions/save}" th:object="${admissionSession}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
            <label class="form-label">Tên đợt</label>
            <input type="text" th:field="*{name}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Năm học (VD: 2026-2027)</label>
            <input type="text" th:field="*{academicYear}" class="form-control" required>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Ngày bắt đầu</label>
                <input type="datetime-local" th:field="*{startDate}" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Ngày kết thúc</label>
                <input type="datetime-local" th:field="*{endDate}" class="form-control" required>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Trạng thái</label>
            <select th:field="*{status}" class="form-select">
                <option value="DRAFT">Nháp (chưa công bố)</option>
                <option value="OPEN">Đang mở nhận hồ sơ</option>
                <option value="CLOSED">Đã đóng</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Mô tả</label>
            <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
        </div>
        <button type="submit" class="btn text-white" style="background-color:#1e3a8a;">Lưu</button>
        <a href="/admin/sessions" class="btn btn-outline-secondary">Hủy</a>
    </form>

    <!-- Phan gan nganh + chi tieu, chi hien khi da co session.id (dang sua, khong phai tao moi) -->
    <div th:if="${admissionSession.id != null}" class="mt-5">
        <h4 class="fw-bold" style="color:#1e3a8a;">Chỉ tiêu ngành trong đợt này</h4>

        <table class="table table-bordered bg-white mt-3">
            <thead class="table-light">
            <tr><th>Ngành</th><th>Chỉ tiêu</th><th>Điểm chuẩn</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="sm : ${sessionMajors}">
                <td th:text="${sm.major.name}"></td>
                <td th:text="${sm.quota}"></td>
                <td th:text="${sm.benchmarkScore ?: '—'}"></td>
                <td class="text-nowrap">
                    <form th:action="@{/admin/sessions/session-major/{id}/run-admission(id=${sm.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Hệ thống sẽ tự động so điểm các hồ sơ đã duyệt (Hồ sơ hợp lệ) với chỉ tiêu ngành này để xác định trúng tuyển. Tiếp tục?');">
                        <input type="hidden" name="sessionId" th:value="${admissionSession.id}">
                        <button type="submit" class="btn btn-sm btn-outline-success">Xét tuyển</button>
                    </form>
                    <form th:action="@{/admin/sessions/session-major/{id}/delete(id=${sm.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Gỡ ngành này khỏi đợt tuyển sinh?');">
                        <input type="hidden" name="sessionId" th:value="${admissionSession.id}">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Gỡ</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(sessionMajors)}">
                <td colspan="4" class="text-center text-muted">Chưa gán ngành nào.</td>
            </tr>
            </tbody>
        </table>

        <p class="text-muted small">
            Nút "Xét tuyển" sẽ tự động xếp <strong>Hồ sơ hợp lệ</strong> theo điểm từ cao xuống thấp,
            lấy đúng theo chỉ tiêu thành <strong>Trúng tuyển</strong>, phần còn lại thành <strong>Không trúng tuyển</strong>,
            đồng thời cập nhật điểm chuẩn.
        </p>

        <form th:action="@{/admin/sessions/{id}/add-major(id=${admissionSession.id})}" method="post" class="row g-2 align-items-end">
            <div class="col-md-6">
                <label class="form-label">Chọn ngành</label>
                <select name="majorId" class="form-select" required>
                    <option th:each="m : ${allMajors}" th:value="${m.id}" th:text="${m.name}"></option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Chỉ tiêu</label>
                <input type="number" name="quota" class="form-control" min="1" required>
            </div>
            <div class="col-md-3">
                <button type="submit" class="btn text-white w-100" style="background-color:#1e3a8a;">Gán ngành</button>
            </div>
        </form>
    </div>
</main>

<div th:replace="~{layout/fragments :: footer}"></div>
</body>
</html>
