<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản trị hệ thống</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{layout/fragments :: header}"></div>

<main class="container py-5">
    <h2 class="fw-bold" style="color:#1e3a8a;">
        Xin chào, <span th:text="${fullName}">Quản trị viên</span>!
    </h2>
    <p class="text-secondary">Quản lý đợt tuyển sinh, ngành học và theo dõi tổng quan hệ thống.</p>

    <div class="row g-4 mt-2">
        <div class="col-md-4">
            <div class="p-4 bg-white border rounded text-center">
                <h1 class="fw-bold" style="color:#1e3a8a;" th:text="${totalSessions}">0</h1>
                <p class="text-secondary mb-0">Đợt tuyển sinh</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="p-4 bg-white border rounded text-center">
                <h1 class="fw-bold" style="color:#1e3a8a;" th:text="${totalMajors}">0</h1>
                <p class="text-secondary mb-0">Ngành đào tạo</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="p-4 bg-white border rounded text-center">
                <h1 class="fw-bold" style="color:#1e3a8a;" th:text="${totalUsers}">0</h1>
                <p class="text-secondary mb-0">Tài khoản người dùng</p>
            </div>
        </div>
    </div>

    <div class="mt-4 d-flex gap-3 flex-wrap">
        <a href="/admin/sessions" class="btn text-white" style="background-color:#1e3a8a;">Quản lý đợt tuyển sinh</a>
        <a href="/admin/majors" class="btn btn-outline-primary">Quản lý ngành học</a>
        <a href="/admin/users" class="btn btn-outline-primary">Quản lý tài khoản</a>
        <a href="/admin/statistics" class="btn btn-outline-success">Xem thống kê</a>
    </div>
</main>

<div th:replace="~{layout/fragments :: footer}"></div>
</body>
</html>
