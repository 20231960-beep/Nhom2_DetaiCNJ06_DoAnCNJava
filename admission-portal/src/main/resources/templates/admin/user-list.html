<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý tài khoản</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{layout/fragments :: header}"></div>

<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold" style="color:#1e3a8a;">Quản lý tài khoản</h2>
        <a href="/admin/users/new" class="btn text-white" style="background-color:#1e3a8a;">+ Tạo tài khoản</a>
    </div>

    <table class="table table-bordered bg-white align-middle">
        <thead class="table-light">
        <tr>
            <th>Tên đăng nhập</th>
            <th>Họ tên</th>
            <th>Email</th>
            <th>Vai trò</th>
            <th>Trạng thái</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${users}">
            <td th:text="${u.username}"></td>
            <td th:text="${u.fullName}"></td>
            <td th:text="${u.email}"></td>
            <td>
                <span class="badge"
                      th:classappend="${u.role.name() == 'ADMIN' ? 'bg-danger' : (u.role.name() == 'STAFF' ? 'bg-warning text-dark' : 'bg-primary')}"
                      th:text="${u.role.label}"></span>
            </td>
            <td>
                <span class="badge" th:classappend="${u.enabled ? 'bg-success' : 'bg-secondary'}"
                      th:text="${u.enabled ? 'Đang hoạt động' : 'Đã khoá'}"></span>
            </td>
            <td class="text-nowrap">
                <a th:href="@{/admin/users/{id}/edit(id=${u.id})}" class="btn btn-sm btn-outline-primary">Sửa</a>

                <form th:action="@{/admin/users/{id}/toggle-enabled(id=${u.id})}" method="post" class="d-inline">
                    <input type="hidden" name="enabled" th:value="${!u.enabled}">
                    <button type="submit" class="btn btn-sm"
                            th:classappend="${u.enabled ? 'btn-outline-secondary' : 'btn-outline-success'}"
                            th:text="${u.enabled ? 'Khoá' : 'Mở khoá'}"></button>
                </form>

                <form th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('Xóa tài khoản này? Hành động không thể hoàn tác.');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Xóa</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(users)}">
            <td colspan="6" class="text-center text-muted">Chưa có tài khoản nào.</td>
        </tr>
        </tbody>
    </table>
</main>

<div th:replace="~{layout/fragments :: footer}"></div>
</body>
</html>
