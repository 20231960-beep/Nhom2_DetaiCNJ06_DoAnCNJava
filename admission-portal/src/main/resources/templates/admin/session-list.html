<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý đợt tuyển sinh</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{layout/fragments :: header}"></div>

<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold" style="color:#1e3a8a;">Quản lý đợt tuyển sinh</h2>
        <a href="/admin/sessions/new" class="btn text-white" style="background-color:#1e3a8a;">+ Thêm đợt</a>
    </div>

    <table class="table table-bordered bg-white">
        <thead class="table-light">
        <tr>
            <th>Tên đợt</th>
            <th>Năm học</th>
            <th>Bắt đầu</th>
            <th>Kết thúc</th>
            <th>Trạng thái</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${sessions}">
            <td th:text="${s.name}"></td>
            <td th:text="${s.academicYear}"></td>
            <td th:text="${#temporals.format(s.startDate, 'dd/MM/yyyy')}"></td>
            <td th:text="${#temporals.format(s.endDate, 'dd/MM/yyyy')}"></td>
            <td>
                <span class="badge"
                      th:classappend="${s.status?.name() == 'OPEN' ? 'bg-success' : (s.status?.name() == 'CLOSED' ? 'bg-secondary' : 'bg-warning text-dark')}"
                      th:text="${s.status}"></span>
            </td>
            <td>
                <a th:href="@{/admin/sessions/{id}/edit(id=${s.id})}" class="btn btn-sm btn-outline-primary">Sửa / Gán ngành</a>
                <form th:action="@{/admin/sessions/{id}/delete(id=${s.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('Xóa đợt tuyển sinh này?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Xóa</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(sessions)}">
            <td colspan="6" class="text-center text-muted">Chưa có đợt tuyển sinh nào.</td>
        </tr>
        </tbody>
    </table>
</main>

<div th:replace="~{layout/fragments :: footer}"></div>
</body>
</html>
