<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đã có lỗi xảy ra</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{layout/fragments :: header}"></div>
<main class="container py-5 text-center" style="max-width:640px;">
    <div class="display-1 fw-bold" style="color:#dc3545;">500</div>
    <h2 class="fw-bold mt-3">Rất tiếc, đã có lỗi xảy ra</h2>
    <p class="text-secondary mt-2">Hệ thống gặp sự cố khi xử lý yêu cầu của bạn. Vui lòng thử lại, hoặc quay về trang chủ.</p>

    <!-- Hien thi noi dung message cu the (neu co) de nguoi dung/nhan vien ky thuat de doan nguyen nhan,
         thay vi chi hien chung chung "co loi xay ra" khong ro nguyen nhan gi -->
    <div th:if="${message != null and !#strings.isEmpty(message)}"
         class="alert alert-warning text-start mt-4">
        <strong>Chi tiết:</strong> <span th:text="${message}"></span>
    </div>

    <a href="/" class="btn text-white mt-3" style="background-color:#1e3a8a;">Về trang chủ</a>
</main>
<div th:replace="~{layout/fragments :: footer}"></div>
</body>
</html>
