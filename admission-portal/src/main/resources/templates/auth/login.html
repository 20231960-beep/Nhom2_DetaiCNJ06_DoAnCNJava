<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - Cổng tuyển sinh trực tuyến</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{layout/fragments :: header}"></div>

<main class="container py-5" style="max-width:420px;">
    <h2 class="mb-4 text-center fw-bold" style="color:#1e3a8a;">Đăng nhập hệ thống</h2>

    <div th:if="${param.error}" class="alert alert-danger">
        Sai tên đăng nhập hoặc mật khẩu. Vui lòng thử lại.
    </div>
    <div th:if="${param.logout}" class="alert alert-success">
        Bạn đã đăng xuất thành công.
    </div>
    <div th:if="${param.registered}" class="alert alert-success">
        Đăng ký thành công! Vui lòng đăng nhập.
    </div>

    <!-- th:action tu dong duoc Thymeleaf-Spring Security chen them hidden input CSRF token -->
    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label">Tên đăng nhập</label>
            <input type="text" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label">Mật khẩu</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn w-100 text-white" style="background-color:#1e3a8a;">
            Đăng nhập
        </button>
    </form>

    <p class="text-center mt-3">
        Chưa có tài khoản? <a href="/register">Đăng ký ngay</a>
    </p>
    <p class="text-center text-muted mt-2" style="font-size:0.9rem;">
        Tài khoản demo: <code>admin</code> / <code>staff01</code> &mdash; mật khẩu <code>admin123</code>
    </p>
</main>

<div th:replace="~{layout/fragments :: footer}"></div>

</body>
</html>
