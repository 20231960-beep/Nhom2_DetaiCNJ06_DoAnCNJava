# =========================================================
# THONG TIN UNG DUNG
# =========================================================
spring.application.name=admission-portal
server.port=8080

# =========================================================
# KET NOI CSDL MYSQL
# Doi lai username/password cho khop voi MySQL cua ban
# =========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/admission_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# CAU HINH JPA / HIBERNATE
# ddl-auto=update: Hibernate se tu dong cap nhat bang neu Entity thay doi
# (vi CSDL da tao san bang script SQL nen dung "update" hoac "validate" la an toan nhat,
#  KHONG dung "create" hoac "create-drop" vi se xoa mat du lieu)
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# open-in-view=true: giu session Hibernate mo trong luc render Thymeleaf, tranh loi
# LazyInitializationException khi template truy cap quan he @ManyToOne/@OneToMany
# (vi du: application.candidate.user.fullName, session.sessionMajors...).
# Danh doi: mot vai truy van them co the chay ngam khi render view - chap nhan duoc voi quy mo do an.
spring.jpa.open-in-view=true

# =========================================================
# THYMELEAF
# =========================================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# =========================================================
# UPLOAD FILE (minh chung ho so: hoc ba, CCCD...)
# =========================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=uploads/documents

# =========================================================
# LOGGING
# =========================================================
logging.level.org.springframework.security=INFO
logging.level.com.university.admission=DEBUG

# =========================================================
# XU LY LOI TAP TRUNG
# Spring Boot tu dong tim template tai templates/error/<ma-loi>.html
# (vi du error/404.html, error/500.html) thay the trang Whitelabel mac dinh.
# include-message=always: cho phep hien thi noi dung message cua exception
# (vi du "Khong tim thay ho so voi id: 5") thay vi an di hoan toan.
# =========================================================
server.error.include-message=always
server.error.include-stacktrace=never

# =========================================================
# EMAIL (tuy chon - dien thong tin SMTP that neu dung tinh nang gui mail)
# =========================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
